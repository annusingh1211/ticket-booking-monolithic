services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketing-backend
    env_file:
      - .env
    restart: unless-stopped
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticketing-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend